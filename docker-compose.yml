version: "3.9"

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        UID: ${UID-1000}
        GID: ${GID-1000}
    working_dir: /workspace
    volumes:
      - ./:/workspace:cached
    command: ["python", "-c", "print('clockodo-mcp dev interpreter ready')"]

  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: clockodo-mcp:latest
    environment:
      CLOCKODO_API_USER: ${CLOCKODO_API_USER}
      CLOCKODO_API_KEY: ${CLOCKODO_API_KEY}
      CLOCKODO_USER_AGENT: ${CLOCKODO_USER_AGENT-clockodo-mcp/0.1.0}
      CLOCKODO_BASE_URL: ${CLOCKODO_BASE_URL-https://my.clockodo.com/api/}
      CLOCKODO_TIMEZONE: ${CLOCKODO_TIMEZONE-Europe/Zurich}
      CLOCKODO_MCP_ROLE: ${CLOCKODO_MCP_ROLE-employee}
      CLOCKODO_MCP_TRANSPORT: ${CLOCKODO_MCP_TRANSPORT-stdio}
      CLOCKODO_MCP_HOST: ${CLOCKODO_MCP_HOST-127.0.0.1}
      CLOCKODO_MCP_ALLOWED_HOSTS: ${CLOCKODO_MCP_ALLOWED_HOSTS-127.0.0.1:*,localhost:*}
      CLOCKODO_MCP_AUTH_TOKEN: ${CLOCKODO_MCP_AUTH_TOKEN-}
    # Example of how an MCP stdio server might be used by a host tool via stdin/stdout.
    # Here we just run the entrypoint which prints a health check for now.
    command: ["clockodo-mcp"]
