name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A new push supersedes the running review, so only the latest commit gets comments
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Fork PRs get no secrets or OIDC token, so the review would always fail there
    if: github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # A direct prompt instead of the code-review plugin: the plugin's
          # sub-agent pipeline ended after 3 turns with no output in CI, and its
          # reasoning isn't visible without show_full_output (public logs).
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for correctness bugs and security problems.
            Get the diff with `gh pr diff` and the description with `gh pr view`;
            read surrounding code with Read/Grep/Glob where needed. Follow CLAUDE.md.

            Report only high-signal issues you have verified in the code: things
            that will fail, give wrong results, or weaken security. No style
            nitpicks, no speculation.

            For each issue, post an inline comment on the relevant line with
            mcp__github_inline_comment__create_inline_comment.
            Finally post one summary with `gh pr comment`: the issues found, or
            "No issues found" plus one line on what you checked.
          claude_args: |
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment"
