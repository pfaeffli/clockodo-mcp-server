name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    # Name kept stable ("test (3.12)") in case it is used as a required check.
    # The make targets run in Docker, so no host Python setup is needed.
    name: test (3.12)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Check formatting
      run: make format-check

    - name: Lint
      run: make lint

    - name: Type check
      run: make type

    - name: Run tests (with coverage threshold)
      run: make test
