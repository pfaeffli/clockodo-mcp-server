[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clockodo-mcp"
dynamic = ["version"]
description = "MCP server wrapper for Clockodo API"
authors = [
  { name = "Clockodo MCP", email = "devnull@example.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.0.0,<2",
  "httpx>=0.27",
  "pydantic>=2.8",
  "python-multipart>=0.0.22",
  # Direct pin to clear CVE-2026-32597 (PyJWT accepts unknown `crit` header
  # extensions). PyJWT is pulled in transitively via mcp; pinning here forces
  # the resolver to pick a fixed version regardless of the transitive lower
  # bound.
  "PyJWT>=2.12.0",
  # Direct pins for transitive deps of the mcp/httpx stack: anyio comes in via
  # mcp and httpx, idna via httpx and anyio. Neither has a transitive lower
  # bound high enough to exclude the advisories below, so pin them here so the
  # runtime image cannot resolve a vulnerable version.
  #   anyio >= 4.14.2  GHSA-88jq-c8qr-r2wr: TLSStream encodes host names with
  #     IDNA 2003, enabling TLS certificate spoofing (critical). Same release
  #     fixes process-pool workers blocking on undrained stderr (medium).
  #   idna  >= 3.15    GHSA-8fx6-5rcm-fq4h: crafted input to idna.encode() can
  #     bypass the CVE-2024-3651 fix (medium).
  "anyio>=4.14.2",
  "idna>=3.15",
]

[project.scripts]
clockodo-mcp = "clockodo_mcp.server:main"

[project.optional-dependencies]
dev = [
  # pytest >= 9.0.3 clears GHSA vulnerable tmpdir handling.
  "pytest>=9.0.3",
  "pytest-cov>=5.0.0",
  "respx>=0.21.1",
  # Lint/format/type tooling is pinned exactly, like ruff, so an upstream
  # release cannot change CI results without a deliberate bump here. black
  # 26.3.1 also clears the arbitrary-file-write advisory in its cache naming.
  "ruff==0.14.10",
  "black==26.3.1",
  "mypy==1.19.1",
  "pylint==4.0.4",
  "pip-tools>=7.4.0",
  # python-dotenv >= 1.2.2 clears symlink following in set_key.
  "python-dotenv>=1.2.2",
  "setuptools-scm>=8.0",
]

[tool.setuptools_scm]
version_file = "src/clockodo_mcp/_version.py"

[tool.black]
line-length = 88
extend-exclude = 'src/clockodo_mcp/_version\.py'

[tool.isort]
profile = "black"
line_length = 88
extend_skip = ["src/clockodo_mcp/_version.py"]

[tool.ruff]
line-length = 88
extend-exclude = ["src/clockodo_mcp/_version.py"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
